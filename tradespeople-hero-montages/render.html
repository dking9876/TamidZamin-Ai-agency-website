<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>TamidZamin animation renderer</title>
  <style>html,body{margin:0;overflow:hidden;background:#081721}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
  <canvas id="canvas" aria-label="Original animated tradespeople"></canvas>
  <script type="module">
    import { render } from './montage.mjs';
    const params = new URLSearchParams(location.search);
    const canvas = document.getElementById('canvas');
    canvas.width = innerWidth; canvas.height = innerHeight;
    const ctx = canvas.getContext('2d', { alpha: false });
    const options = {
      edit: Number(params.get('edit') || 0),
      square: params.get('square') === '1',
      clean: params.get('clean') === '1',
      scene: params.get('scene') || null
    };
    window.renderFrame = t => render(ctx, t, options);
    window.captureFrame = t => {
      window.renderFrame(t);
      return canvas.toDataURL('image/png').split(',')[1];
    };
    window.renderFrame(0);
    window.animationReady = true;
  </script>
</body>
</html>
